_format_version: "3.0"
_transform: true

# =====================================================================
# Kong Declarative Configuration
# Plugins aktif: jwt, rate-limiting, cors
# Services yang dikelola: auth (fase awal)
# =====================================================================

# ─── JWT Credential Secrets ──────────────────────────────────────────
# Didaftarkan pada consumer level; setiap microservice client
# mendapat key/secret sendiri.
consumers:
  - username: frontend-client
    jwt_secrets:
      - key: frontend-key
        algorithm: HS256
        secret: "${KONG_JWT_SECRET_FRONTEND}"

# ─── Global plugins (berlaku untuk semua route) ──────────────────────
plugins:
  # Prometheus — expose metrik Kong di Admin API port 8001 (/metrics)
  # Di-scrape oleh Prometheus server (job "kong" → kong:8001).
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # Rate Limiting global — fallback jika route tidak punya override
  - name: rate-limiting
    config:
      minute: 300
      hour: 6000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS global
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://100.90.187.130:5173"
        - "${FRONTEND_URL}"
        - ".*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
        - X-RateLimit-Remaining-Minute
      credentials: true
      max_age: 3600
      preflight_continue: false

  # Security response headers — injected on every proxied response (defense
  # in depth). HSTS is harmless over plain HTTP (browsers ignore it) and takes
  # effect once traffic is served via the HTTPS Cloudflare Tunnel.
  - name: response-transformer
    config:
      add:
        headers:
          - "Content-Security-Policy: default-src 'self'"
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "Referrer-Policy: no-referrer"
          - "Permissions-Policy: geolocation=(), camera=(), microphone=()"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
      remove:
        headers:
          - "Server"
          - "X-Powered-By"

# ─── Upstreams ────────────────────────────────────────────────────────
upstreams:
  - name: auth-upstream
    algorithm: round-robin
    healthchecks:
      active:
        http_path: /health
        healthy:
          interval: 10
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 2
    targets:
      - target: auth:8080
        weight: 100

