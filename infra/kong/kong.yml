              hour: 8000
              policy: local
              fault_tolerant: true
      - name: stream-hls
        paths:
          - /hls
        methods:
          - GET
          - OPTIONS
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              hour: 8000
              policy: local
              fault_tolerant: true

  # MediaMTX HLS redirect — handles MediaMTX cookie-check redirects to
  # /<stream-name>/index.m3u8?cookieCheck=1. The regex matches any
  # single-segment stream path followed by /index.m3u8.
  - name: mediamtx-hls-redirect-service
    host: mediamtx-hls-redirect-upstream
    port: 8888
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: stream-hls-redirect
        paths:
          - ~/[^/]+/index\.m3u8
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              hour: 8000
              policy: local
              fault_tolerant: true

