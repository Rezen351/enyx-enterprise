# ─── Services ─────────────────────────────────────────────────────────
services:
  # Auth Service
  - name: auth-service
    host: auth-upstream
    port: 8080
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000

    routes:
      # ── Public routes (no JWT required) ──────────────────────────
      - name: auth-public-v1
        paths:
          - ~/v1(?<rel_uri>/auth/login)
          - ~/v1(?<rel_uri>/auth/register)
          - ~/v1(?<rel_uri>/auth/refresh)
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: $(uri_captures['rel_uri'])
          - name: rate-limiting
            config:
              minute: 60
              hour: 2000
              policy: local
              fault_tolerant: true
              error_message: "Too many login attempts. Please try again later."

      - name: auth-public
        paths:
          - /auth/login
          - /auth/register
          - /auth/refresh
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          # Rate-limit lebih ketat untuk endpoint auth publik (anti-brute-force)
          - name: rate-limiting
            config:
              minute: 60
              hour: 2000
              policy: local
              fault_tolerant: true
              error_message: "Too many login attempts. Please try again later."

      # ── Health check (public, NOT rate-limited) ──────────────────
      # Probes must stay reachable under load, so /health gets only the
      # generous global limit instead of the strict auth-public one.
      - name: auth-health-v1
        paths:
          - ~/v1(?<rel_uri>/health)
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: $(uri_captures['rel_uri'])

      - name: auth-health
        paths:
          - /health
        methods:
          - GET
          - OPTIONS
        strip_path: false

      # ── Protected routes (JWT required) ──────────────────────────
      - name: auth-protected-v1
        paths:
          - ~/v1(?<rel_uri>/auth/me)
          - ~/v1(?<rel_uri>/auth/logout)
          - ~/v1(?<rel_uri>/auth/password)
          - ~/v1(?<rel_uri>/auth/sessions)
          - ~/v1(?<rel_uri>/auth/account)
          - ~/v1(?<rel_uri>/auth/users.*)
          - ~/v1(?<rel_uri>/auth/roles.*)
          - ~/v1(?<rel_uri>/auth/permissions.*)
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: $(uri_captures['rel_uri'])
          - name: rate-limiting
            config:
              minute: 300
              hour: 8000
              policy: local
              fault_tolerant: true

      - name: auth-protected
        paths:
          - /auth/me
          - /auth/logout
          - /auth/password
          - /auth/sessions
          - /auth/account
          - /auth/users
          - /auth/roles
          - /auth/permissions
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 401
              message: "missing or invalid Authorization header"
            enabled: false   # disabled — JWT validation handled by the service itself
          - name: rate-limiting
            config:
              minute: 300
              hour: 8000
              policy: local
              fault_tolerant: true

  # Module Service — onboarding perangkat (module & node)
