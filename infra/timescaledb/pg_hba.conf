# =====================================================================
# Custom pg_hba.conf for TimescaleDB containers in Docker bridge network
# =====================================================================
# Allow local socket connections
local   all             all                                     trust
# Allow localhost TCP connections
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5
# Allow Docker bridge network (iot-net uses 172.17.0.0/16)
host    all             all             172.17.0.0/16           md5
host    all             all             172.18.0.0/16           md5
# Allow any Docker network (more permissive for local development)
host    all             all             0.0.0.0/0               md5
